name: Format Check

# pr.yml's heavy jobs (build, type-check, lint, test matrix) are paths-ignored for
# **.md/docs/** so a doc-only PR doesn't pay for a full build. oxfmt also formats
# Markdown (see AGENTS.md's Code Quality section), so that paths-ignore used to skip
# the one check a doc-only PR actually needs, and the drift only surfaced later via
# formatting.yml's nightly auto-fix PR. This workflow runs unconditionally -- no
# paths-ignore -- and needs no native build, so firing on every PR costs almost
# nothing (HarperFast/rocksdb-js#916).
#
# No required status checks are currently configured on main (classic branch
# protection's required_status_checks.contexts/.checks are both empty), so adding
# this job cannot leave a doc-only PR with a permanently pending required check.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        # --ignore-scripts: oxfmt --check needs no native build, so skip node-gyp's
        # RocksDB prebuild fetch entirely (the only thing pr.yml's setup-deps action
        # and its GH_TOKEN are for).
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Check formatting
        run: pnpm fmt:check
