name: Benchmark

# Runs on a self-hosted runner, so it must never be triggered by pull requests:
# in a public repo that would run untrusted fork code on our hardware.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Do you want to run the full or essential benchmark suite?'
        default: 'full'
        required: false
        type: choice
        options:
          - 'full'
          - 'essential'

concurrency:
  # cancel-in-progress only affects a RUNNING run; GitHub also drops an older QUEUED run when a
  # newer one joins its group. PRs share one group per ref so a new commit supersedes the old run;
  # push/dispatch get a group unique to the run so quick successive merges to main never cancel
  # each other's results.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: [self-hosted, linux, benchmark]
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Identify RocksDB prebuild
        id: prebuild
        uses: ./.github/actions/rocksdb-prebuild-stamp
        with:
          gh-token: ${{ secrets.GH_TOKEN }}

      - name: Setup RocksDB cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: deps/rocksdb
          key: benchmark-rocksdb-${{ steps.prebuild.outputs.stamp }}-${{ hashFiles('package.json') }}
          restore-keys: |
            benchmark-rocksdb-${{ steps.prebuild.outputs.stamp }}-

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm build

      - name: Download previous benchmark results
        id: baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf baseline && mkdir baseline
          run_ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow benchmark.yml \
            --event release --status success --limit 10 \
            --json databaseId --jq '.[].databaseId')
          for run_id in $run_ids; do
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                --pattern 'benchmark-results-*' --dir baseline 2>/dev/null; then
              file=$(find baseline -name benchmark-results.json | head -n 1)
              if [ -n "$file" ]; then
                echo "file=$file" >> "$GITHUB_OUTPUT"
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          done
          echo "No previous benchmark results found; skipping comparison."

      - name: Run benchmarks
        env:
          BENCHMARK_MODE: ${{ github.event.inputs.mode || 'essential' }}
          BASELINE_FILE: ${{ steps.baseline.outputs.file }}
          NO_COLOR: '1'
        shell: bash
        run: |
          if [ -n "$BASELINE_FILE" ]; then
            pnpm bench --compare "$BASELINE_FILE" 2>&1 | tee bench-output.txt
          else
            pnpm bench 2>&1 | tee bench-output.txt
          fi

      - name: Summarize benchmark comparison
        if: always() && hashFiles('bench-output.txt') != ''
        env:
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
        run: |
          {
            echo "## Benchmark results"
            echo
            if [ -n "$BASELINE_RUN_ID" ]; then
              echo "Baseline: latest successful release run ([#$BASELINE_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN_ID)). In each benchmark the first row is this run and the \`(baseline)\` row is the previous one."
            else
              echo "No baseline found; not compared."
            fi
            echo
            echo '```'
            # Stay under the 1 MiB summary limit
            tail -c 900000 bench-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results as artifact
        if: always() && hashFiles('benchmark-results.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark-results.json
          retention-days: 90
